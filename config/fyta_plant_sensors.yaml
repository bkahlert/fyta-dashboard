# FYTA plant sensor bridges — generated by scripts/generate-plant-sensors.mjs
# Place in your HA config packages directory and reload template entities.
template:
  - sensor:
      - name: "Aspen Plant"
        unique_id: aspen_plant
        state: "{{ states('sensor.aspen_moisture') | float(0) }}"
        unit_of_measurement: "%"
        device_class: moisture
        state_class: measurement
        attributes:
          moisture_state: "{{ states('sensor.aspen_moisture_state') }}"
          device_name: "{{ device_attr(device_id('sensor.aspen_moisture_state'), 'name') }}"
          scientific_name: "{{ states('sensor.aspen_scientific_name') }}"
          picture_url: "{{ state_attr('image.aspen', 'entity_picture') }}"
          temperature_state: "{{ states('sensor.aspen_temperature_state') }}"
          light_state: "{{ states('sensor.aspen_light_state') }}"
          nutrients_state: "{{ states('sensor.aspen_nutrients_state') }}"
          battery: "{{ states('sensor.aspen_battery') | int(0) }}"
          next_fertilization: "{{ states('sensor.aspen_next_fertilization') }}"
          benutzerbild_url: "{%- set _fn = state_attr('sensor.aspen_moisture', 'friendly_name') -%}{%- set _slug = _fn.split(' ')[:-1] | join('_') | lower | replace('ü','u') | replace('ö','o') | replace('ä','a') | replace('ß','ss') -%}{{ state_attr('image.' + _slug + '_benutzerbild', 'entity_picture') }}"

